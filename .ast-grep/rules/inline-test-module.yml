# CLAUDE.md, How we build: "Tests live in their own file": `#[cfg(test)] mod tests;`, never a `{ ... }` body.
id: inline-test-module
language: Rust
severity: error
message: "an inline test module; move its body to its own file and keep `mod <name>;`"
files:
  - crates/**/*.rs
ignores:
  - '**/tests.rs'
  - '**/*_tests.rs'
  - '**/tests/**'
  - '**/benches/**'
  - '**/examples/**'
rule:
  kind: mod_item
  has:
    field: body
    kind: declaration_list
  any:
    - matches: cfg-test-item
    # A test module without `#[cfg(test)]` is still a test module.
    - has:
        field: body
        has:
          kind: attribute_item
          regex: '^#\[(gpui::)?test(\(.*\))?\]$'
