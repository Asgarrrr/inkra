# CLAUDE.md, Architecture: "reading or writing a file → `vault`, behind `Fs`; `app` opens no file".
id: no-fs-in-app
language: Rust
severity: error
message: "a disk access in `app`; read, write and stat through `inkra_vault::Fs`"
files:
  - crates/app/src/**/*.rs
ignores:
  # shot is the off-screen render dev tool: it writes under target/, never the vault. no-theme-literal exempts it too.
  - crates/app/src/shot/**
  # The launch picks vault or note from the argument; it is where `RealFs` is chosen.
  - crates/app/src/bootstrap.rs
  - '**/tests.rs'
  - '**/*_tests.rs'
  - '**/test_support.rs'
  - '**/tests/**'
  - '**/benches/**'
  - '**/examples/**'
utils:
  in-std-use-list:
    inside:
      kind: use_list
      inside:
        kind: scoped_use_list
        has:
          field: path
          regex: '^(::)?std$'
rule:
  all:
    - any:
        - kind: scoped_identifier
          regex: '^(::)?std::fs$'
        - kind: identifier
          regex: '^fs$'
          any:
            - matches: in-std-use-list
            - inside:
                field: path
                any:
                  - kind: scoped_identifier
                  - kind: scoped_use_list
                  - kind: use_as_clause
                matches: in-std-use-list
        # A stat through `Path` reaches the disk too, and a `MemFs` test never sees it. Argumentless: `Fs::read_dir` takes a path. Not `is_dir`/`exists`: `Kind` has them too.
        - kind: call_expression
          all:
            - has:
                field: function
                kind: field_expression
                has:
                  field: field
                  regex: '^(try_exists|is_symlink|canonicalize|symlink_metadata|read_link|read_dir)$'
            - has:
                field: arguments
                regex: '^\(\s*\)$'
        - kind: scoped_identifier
          regex: '^((::)?image::open|(.*::)?ImageReader::open)$'
        # Macro arguments stay unparsed tokens; match the innermost tree's text.
        - kind: token_tree
          regex: '\bstd\s*::\s*fs\b'
          not:
            has:
              stopBy: end
              kind: token_tree
              regex: '\bstd\s*::\s*fs\b'
    - not:
        inside:
          stopBy: end
          matches: cfg-test-item
