# CLAUDE.md, How we build: a comment is "for a why the code cannot show"; deferred work goes in docs/roadmap.md.
id: shortcut-comment
language: Rust
severity: error
message: "a comment or panic message admits a shortcut; fix it or record it in docs/roadmap.md"
files:
  - crates/**/*.rs
ignores:
  - '**/tests.rs'
  - '**/*_tests.rs'
  - '**/test_support.rs'
  - '**/tests/**'
  - '**/benches/**'
  - '**/examples/**'
rule:
  any:
    # Not "temporary": a temporary file is vault vocabulary. TODO and XXX are markers only in capitals: a task's "todo" is markdown vocabulary.
    - any:
        - kind: line_comment
        - kind: block_comment
      regex: '\b(TODO|XXX)\b|(?i:\bfor now\b|workaround|stopgap|\bhack(y|ish)?\b|\btodo:|\bfix ?me\b)'
    # `todo!` and `unimplemented!` are denied; a panic saying the same is the same shortcut.
    - kind: macro_invocation
      has:
        field: macro
        regex: '^(panic|unreachable)$'
      regex: '(?i)\bnot (yet )?implemented\b|!\s*\(\s*"todo\b'
  # A comment between `#[cfg(test)]` and its item matches the utility itself.
  not:
    any:
      - matches: cfg-test-item
      - inside:
          stopBy: end
          matches: cfg-test-item
