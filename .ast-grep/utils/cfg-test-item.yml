# The item a `#[test]`, `#[cfg(test)]` or `#[cfg(any(test, ...))]` applies to; other attributes and comments may sit between.
id: cfg-test-item
language: Rust
rule:
  follows:
    stopBy:
      not:
        any:
          - kind: attribute_item
          - kind: line_comment
          - kind: block_comment
    kind: attribute_item
    regex: '^#\[(test|cfg\(test\)|cfg\(any\(test\b.*\)\))\]$'
