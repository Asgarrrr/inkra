# `vendor/` is gitignored, but `inkra-app` resolves gpui through it, so the
# scratch copy must keep it. It is a symlink with an absolute target, so only
# the link is copied.
gitignore = false

# The config has no equivalent of `--package`; these globs mutate the same
# four crates.
examine_globs = ["crates/text/src/**/*.rs", "crates/editor/src/**/*.rs", "crates/markdown/src/**/*.rs", "crates/index/src/**/*.rs"]

# `editor` tests exercise `text`, so both suites run against every mutant.
# This also keeps gpui out of every test run.
test_package = ["inkra-text", "inkra-editor", "inkra-markdown", "inkra-index"]

# Matched by column, not line, so edits above it do not silently re-enable it.
# Equivalent. `removed_len` is a `usize`, so `>= 0` is always true. When
# `removed_len == 0`, `touched_end == at`, and this branch has `offset >= at`,
# so `offset.0 < touched_end` is false and the conjunction is false either way.
#
# Matched by function, not line, for the same reason.
# Equivalent. `backlinks` shares a result per written target without allocating,
# except for a relative link; forcing every link down the allocating path gives
# the same resolutions.
#
# Equivalent. The `Options` flags in `options` are pairwise disjoint bits in
# pulldown-cmark 0.13.4, so `^` and `|` give the same set.
#
# Equivalent. `fits` and the `CharBag` test only skip the DP early: the DP finds
# no alignment for a note they would reject, so `score` returns `None` anyway.
#
# Equivalent. No cell is ever within reach of `NONE / 2`: a real score is
# positive and an unreachable one stays near `NONE`. So `>=`, `NONE * 2`
# (`i32::MIN`, no overflow) and `true` admit only cells that lose every `max`
# to a real one or that no real score equals; `fits` guarantees a real one.
exclude_re = [
    "^crates/text/src/anchor\\.rs:[0-9]+:48: replace > with >= in transform$",
    "^crates/markdown/src/parse\\.rs:[0-9]+:[0-9]+: replace \\| with \\^ in options$",
    "^crates/index/src/index\\.rs:[0-9]+:[0-9]+: replace match guard \\*style != Style::Relative with false in LinkIndex::backlinks$",
    "^crates/index/src/names/score\\.rs:[0-9]+:[0-9]+: replace (fits -> bool with true|\\|\\| with && in score)$",
    "^crates/index/src/names/score\\.rs:[0-9]+:[0-9]+: replace (reachable -> bool with true|> with >= in reachable|/ with \\* in reachable)$",
]
