# The config has no equivalent of `--package`; these globs mutate the same
# six crates.
examine_globs = ["crates/text/src/**/*.rs", "crates/editor/src/**/*.rs", "crates/markdown/src/**/*.rs", "crates/index/src/**/*.rs", "crates/tabs/src/**/*.rs", "crates/layout/src/**/*.rs"]

# `editor` tests exercise `text`, so both suites run against every mutant.
# This also keeps gpui out of every test run.
test_package = ["inkra-text", "inkra-editor", "inkra-markdown", "inkra-index", "inkra-tabs", "inkra-layout"]

# Matched by column, not line, so edits above it do not silently re-enable it.
# Equivalent. `removed_len` is a `usize`, so `>= 0` is always true. When
# `removed_len == 0`, `touched_end == at`, and this branch has `offset >= at`,
# so `offset < touched_end` is false and the conjunction is false either way.
#
# Matched by function, not line, for the same reason.
# Equivalent. The `Options` flags in `options` are pairwise disjoint bits in
# pulldown-cmark 0.13.4, so `^` and `|` give the same set.
#
# Equivalent. `backlinks` shares a result per written target without allocating,
# except for a relative link; forcing every link down the allocating path gives
# the same resolutions.
#
# Matched by column: the other `||` in `representative` is not equivalent.
# Equivalent. With `&&`, a cased ASCII char or an uncased non-ASCII one reaches the
# lookup, but `REPRESENTATIVES` holds only cased chars from U+0080 up, so it returns `c`.
#
# Equivalent. `merged` joins a segment's alive postings with fresh ones, and an ordinal is
# alive or fresh, never both, so no two items are equal and `<=` picks as `<` does.
#
# Matched by column: the other `+` in `build` is not equivalent.
# Equivalent. `/` is no word char, so no word starts at the last `/`: a word is at or
# past it exactly when it is past it, and `at * 1` places the same words in the stem.
#
# App files run with `cargo mutants -p inkra-app --test-package inkra-app -f <file>`,
# which keeps this config, so the entries below apply.
#
# Unobservable. The apply budget is wall time: a turn whose elapsed time equals
# the budget exactly cannot be staged in a test.
#
# Unobservable. The timeline line goes to stderr only; `||` prints it on every
# mark in release and whenever the line is due in a test, and no test reads stderr.
#
# Equivalent. `Visible::step` takes only 1 or -1 (`select_next`, `select_prev`), so
# `delta >= 0` and `delta > 0` agree on every call.
#
# Unobservable. A failed cache read is `Missing` either way: the not-found guard
# only decides whether a line is logged, and no test reads the log.
#
# Equivalent. `walk` starts `jobs.parallelism().max(1)` jobs, and `Serial` runs them
# one after another, so the first drains the queue: 0 and 1 give the same walk.
#
# Equivalent. In `reveal_block`, a caret exactly at the scroll keeps it with either
# `<`, and one exactly a margin inside the right edge asks for the scroll it has.
#
# Equivalent. `TextElement`'s wheel listener runs in the bubble phase and its hover listener in
# the capture phase; swapped, each sees the same hitboxes, and nothing after it stops the event.
#
# Equivalent. An image whose longest side is exactly `DRAWN_SIDE` already fits, so
# `thumbnail` keeps its size and its pixels: `>=` and `>` decode the same bytes.
#
# Equivalent. `MD` and `FRAGMENT` are disjoint bits, so `^` and `|` build the same byte.
#
# The vault runs with `cargo mutants -p inkra-vault --test-package inkra-vault -f 'crates/vault/src/**/*.rs'`.
# `-f` is needed because `examine_globs` leaves the vault out. Its suite (~3 s) uses a
# real disk and a watcher, too slow to run against every other crate's mutants.
#
# Equivalent. A collision `hard_link` refuses also reaches `guarded_rename`, which renames
# the same file and refuses a different one with `AlreadyExists` at `to`.
#
# Unobservable. Both delete methods trash the file; they differ in a permission
# prompt and Finder's "Put Back" metadata, which no test sees.
#
# Unobservable. `MemFs` mtimes only need to differ per tick; every variant keeps
# them distinct, and no test reads their value.
#
# Equivalent. `release` consumes the gate, and dropping it closes the channel,
# which the parked operation reads as a release.
exclude_re = [
    "^crates/text/src/anchor\\.rs:[0-9]+:44: replace > with >= in transform$",
    "^crates/markdown/src/cmark\\.rs:[0-9]+:[0-9]+: replace \\| with \\^ in options$",
    "^crates/index/src/index\\.rs:[0-9]+:[0-9]+: replace match guard style != Style::Relative with false in NoteIndex::backlinks$",
    "^crates/index/src/words/fold\\.rs:[0-9]+:21: replace \\|\\| with && in representative$",
    "^crates/index/src/words/segment\\.rs:[0-9]+:[0-9]+: replace < with <= in merged$",
    "^crates/index/src/words/name_words\\.rs:[0-9]+:58: replace \\+ with \\* in NameWords::build$",
    "^crates/app/src/index/loading\\.rs:[0-9]+:[0-9]+: replace < with <= in IndexSync::apply_landed$",
    "^crates/app/src/timeline\\.rs:[0-9]+:[0-9]+: replace && with \\|\\| in Timeline::mark$",
    "^crates/app/src/sidebar/visible\\.rs:[0-9]+:[0-9]+: replace > with >= in Visible::step$",
    "^crates/app/src/index/cache_file\\.rs:[0-9]+:[0-9]+: replace match guard error\\.io_kind\\(\\) == Some\\(ErrorKind::NotFound\\) with (true|false) in read$",
    "^crates/app/src/index/cache_file\\.rs:[0-9]+:[0-9]+: replace == with != in read$",
    "^crates/vault/src/jobs\\.rs:[0-9]+:[0-9]+: replace <impl Jobs for Serial>::parallelism -> usize with 0$",
    "^crates/app/src/editor/block_scroll\\.rs:[0-9]+:[0-9]+: replace (< with <=|> with >=) in EditorView::reveal_block$",
    "^crates/app/src/editor/element\\.rs:[0-9]+:22: replace != with == in <impl Element for TextElement>::paint$",
    "^crates/app/src/editor/element\\.rs:[0-9]+:26: replace == with != in <impl Element for TextElement>::paint$",
    "^crates/app/src/images/decode\\.rs:[0-9]+:[0-9]+: replace > with >= in decode$",
    "^crates/index/src/persist/notes\\.rs:[0-9]+:[0-9]+: replace \\| with \\^ in link_flags$",
    "^crates/vault/src/real_fs\\.rs:[0-9]+:[0-9]+: replace match guard error\\.kind\\(\\) == io::ErrorKind::AlreadyExists with false in <impl Fs for RealFs>::rename$",
    "^crates/vault/src/real_fs\\.rs:[0-9]+:[0-9]+: replace trash_method with \\(\\)$",
    "^crates/vault/src/mem_fs\\.rs:[0-9]+:[0-9]+: replace \\+ with (-|\\*) in MemFs::tick$",
    "^crates/vault/src/mem_fs/faults\\.rs:[0-9]+:[0-9]+: replace Gate::release with \\(\\)$",
]
