name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # gpui needs the Apple platform crates (gpui_macos); it does not build on Linux.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Toolchain comes from rust-toolchain.toml; rustup resolves and installs
      # the pinned channel on the first cargo/rustup call below. No separate
      # toolchain action, so nothing can pick a different version.
      - name: Show toolchain
        run: rustup show

      # ast-grep is not in install-action's list; its default cargo-binstall fallback fetches it.
      # Pinned to the versions check.sh is green on: a new typos dictionary must not fail an unrelated PR.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,ast-grep@0.51.1,typos@1.52.1

      # Caches the registry, cargo's git checkout of Zed, and their builds.
      - uses: Swatinem/rust-cache@v2

      # check.sh is the definition of done; run it, not a reimplementation of
      # its steps, so CI and the local gate cannot drift apart.
      - name: Run check.sh
        run: ./scripts/check.sh
