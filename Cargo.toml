[workspace]
resolver = "3"
members = ["crates/text", "crates/editor", "crates/app"]

[workspace.dependencies]
inkra-text = { path = "crates/text" }
inkra-editor = { path = "crates/editor" }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
