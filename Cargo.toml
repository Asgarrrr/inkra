[workspace]
resolver = "3"
members = ["crates/text", "crates/editor", "crates/app", "crates/vault"]
# Without this, cargo treats the vendored zed checkout as part of *this*
# workspace and tries to inherit `edition` from our root instead of zed's.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
inkra-text = { path = "crates/text" }
inkra-editor = { path = "crates/editor" }
inkra-vault = { path = "crates/vault" }
proptest = "1"
futures = "0.3"
# Default features add `rayon` (parallel bootstrap resampling) and `plotters`
# (SVG chart rendering for HTML reports) — neither has a consumer here: no
# baseline is committed and no report is ever opened. `cargo_bench_support` is
# the one default feature that stays: without it, `cargo bench` itself refuses
# to run a `harness = false` binary.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
