[workspace]
resolver = "3"
members = ["crates/text", "crates/editor", "crates/app", "crates/vault", "crates/markdown", "crates/index"]
# Else cargo treats the vendored zed checkout as a member of this workspace.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
inkra-text = { path = "crates/text" }
inkra-editor = { path = "crates/editor" }
inkra-vault = { path = "crates/vault" }
inkra-markdown = { path = "crates/markdown" }
inkra-index = { path = "crates/index" }
proptest = "1"
futures = "0.3"
unicode-segmentation = "1.13"
# No rayon or plotters; see docs/tooling.md.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
