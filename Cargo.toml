[workspace]
resolver = "3"
members = ["crates/text", "crates/editor", "crates/app", "crates/vault"]
# Without this, cargo treats the vendored zed checkout as part of *this*
# workspace and tries to inherit `edition` from our root instead of zed's.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
inkra-text = { path = "crates/text" }
inkra-editor = { path = "crates/editor" }
inkra-vault = { path = "crates/vault" }
proptest = "1"
futures = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
