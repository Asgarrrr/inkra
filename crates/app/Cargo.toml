[package]
name = "inkra-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Off-screen shots; `gpui_platform/test-support` gates the capture itself (offscreen-shots spec).
shot = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "inkra-vault/test-support",
]

# `cargo test` compiles examples, and this one names a gated module.
[[example]]
name = "shot"
required-features = ["shot"]

[dependencies]
inkra-text = { workspace = true }
inkra-editor = { workspace = true }
inkra-vault = { workspace = true }
inkra-markdown = { workspace = true }
inkra-index = { workspace = true }
inkra-tabs = { workspace = true }
inkra-layout = { workspace = true }
# `block_on` before a gpui executor exists; `mpsc` and `oneshot` channels, `lock::Mutex`, `select_biased!`, `join_all`.
futures = { workspace = true }
# Wrap snapping per line; `Buffer`'s grapheme steps scan the whole document.
unicode-segmentation = { workspace = true }
# Pinned by commit; vendor-gpui.sh checks out this same rev for reading.
gpui = { git = "https://github.com/zed-industries/zed", rev = "a1f2e21c2c95c6679945d88996e8324a6cc97e47" }
# Without font-kit macOS renders no text, and only logs a warning.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a1f2e21c2c95c6679945d88996e8324a6cc97e47", features = [
    "font-kit",
] }
# The session file (restore-tabs spec, R2); the majors gpui already locks.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The facade gpui already locks; `logger.rs` installs the only logger.
log = "0.4"
# Same `^0.25` as gpui, so `RgbaImage` is one type on both sides.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
    "pnm",
] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "a1f2e21c2c95c6679945d88996e8324a6cc97e47", features = [
    "test-support",
] }
# `MemFs` — tests must never reach the real filesystem.
inkra-vault = { workspace = true, features = ["test-support"] }
# For the scroll geometry and the index's snapshot diff: pure logic, no window.
proptest = { workspace = true }

[lints]
workspace = true
