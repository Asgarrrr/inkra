[package]
name = "inkra-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# Else `cargo bench` forwards criterion flags like `--quick` to the lib and fails.
bench = false

[dependencies]
crc32fast = "1.5"
foldhash = "0.2.0"
inkra-markdown = { workspace = true }
inkra-text = { workspace = true }
inkra-vault = { workspace = true }
percent-encoding = "2.3"
regex-syntax = "0.8.11"
unicode-normalization = "0.1.25"
unicode-segmentation = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
futures = { workspace = true }
inkra-vault = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
regex = "1.13"

[lints]
workspace = true

[[bench]]
name = "find"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "live"
harness = false

[[bench]]
name = "names"
harness = false

[[bench]]
name = "read_search"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "words"
harness = false

[[bench]]
name = "persist"
harness = false
