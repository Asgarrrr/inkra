[package]
name = "inkra-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Else `cargo bench` forwards criterion flags like `--quick` to the lib and fails.
bench = false

[dependencies]
inkra-markdown = { workspace = true }
inkra-text = { workspace = true }
inkra-vault = { workspace = true }
percent-encoding = "2.3"
unicode-normalization = "0.1.25"

[dev-dependencies]
criterion = { workspace = true }
futures = { workspace = true }
inkra-vault = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "index"
harness = false

[[bench]]
name = "names"
harness = false
