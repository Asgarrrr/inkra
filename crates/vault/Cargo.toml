[package]
name = "inkra-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Else `cargo bench` forwards criterion flags like `--quick` to the lib and fails.
bench = false

[features]
# Keeps `MemFs` out of release; the self dev-dependency enables it for tests.
test-support = []

[dependencies]
async-trait = "0.1"
thiserror = "2"
# Published crate, not Zed's fork; macOS method overridden in `trash_method` (create-rename-delete spec).
trash = "5"
# `Fs::watch`'s channel, and `MemFs`'s gates.
futures = { workspace = true }
# 8.2, the stable line: 9.0 is a release candidate (watcher spec, F1).
notify = "8.2"

[dev-dependencies]
inkra-vault = { path = ".", features = ["test-support"] }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "vault"
harness = false

# Workspace lints are opt-in per crate.
[lints]
workspace = true
