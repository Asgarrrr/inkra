[package]
name = "inkra-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Else `cargo bench` forwards criterion flags like `--quick` to the lib and fails.
bench = false

[features]
# Keeps `MemFs` out of release; the self dev-dependency enables it for tests.
test-support = ["dep:futures"]

[dependencies]
async-trait = "0.1"
thiserror = "2"
# Published crate, not Zed's fork; macOS method overridden in `trash_method` (create-rename-delete spec).
trash = "5"
# `MemFs::block_load` only: parking a load needs a real waker.
futures = { workspace = true, optional = true }

[dev-dependencies]
inkra-vault = { path = ".", features = ["test-support"] }
futures = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "vault"
harness = false

# Workspace lints are opt-in per crate.
[lints]
workspace = true
