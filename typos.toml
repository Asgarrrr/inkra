# Each entry is deliberate. Fix a real misspelling instead of listing it here.
# Prefer the narrowest scope: a pattern for one site, an identifier over a word.

[default]
extend-ignore-re = [
  # Hyphenated prefix in prose: "mis-colours", "mis-sizes".
  '\bmis-',
  # "caf\u{e9}" in fixtures: the escape leaves "caf" as a word.
  '[Cc]af\\u\{e9\}',
  # French fixture lines.
  'je ne suis pas sur',
  'le projet avance',
  # Syllable list in crates/index/benches/words/corpus.rs and its plan.
  '"ment", "tion"',
  # Apple's mach_timebase_info field, in scripts/bench/measure.swift.
  'timebase\.numer',
  # Verbatim quote of a Zed comment in the conflict-detection spec.
  'has prooven to',
]

[default.extend-identifiers]
# Commit hash in docs/benchmarks.md.
"698daa8" = "698daa8"
# "PNGs" is split into "PN" and "Gs" otherwise.
PNGs = "PNGs"
# Local variable for literal link text.
lits = "lits"
# The `scap` crate.
scap = "scap"

[default.extend-words]
# French search fixtures, in 100+ places; no narrower scope fits.
projet = "projet"
projets = "projets"

[files]
# `.claude/`, `.ast-grep/` and `.github/` hold prose and rules too. `.claude/worktrees/` holds untracked agent checkouts.
ignore-hidden = false
extend-exclude = [".git/", ".claude/worktrees/"]
